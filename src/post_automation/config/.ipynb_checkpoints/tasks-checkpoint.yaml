validate_cv_task:
  description: >
    Perform a technical and structural analysis of the candidate’s resume. 
    Ensure there are no formatting issues, strange characters, or inconsistencies before personalisation.
    Provide structured feedback on improvements and red flags if applicable.
  expected_output: >
    A summary report of the CV's health: format issues, character errors, structure inconsistencies.

research_task:
  description: >
    Analyze the job posting URL provided ({job_posting_url})
    to extract key skills, experiences, and qualifications
    required. Use the tools to gather content and identify
    and categorize the requirements.
  expected_output: >
    A structured list of job requirements, including necessary
    skills, qualifications, and experiences.
  agent: researcher

profile_task:
  description: >
    Compile a detailed personal and professional profile 
    using the GitHub {github_url} URLs, and personal portfolio 
    {personal_portfolio_url}. Utilize tools to extract and 
    synthesize information from these sources.
  expected_output: >
    A comprehensive profile document that includes skills,
    project experiences, contributions, interests, and 
    communication style.
  agent: profiler

resume_strategy_task:
  description: >
    Using the validated resume, profile, and job requirements, tailor the resume 
    to highlight the most relevant areas. Clean special characters, 
    adapt to a UK layout, and ensure no false data is inserted.
  expected_output: >
    An updated UK-style Markdown resume with accurate and verified content.
  agent: resumer_strategist

github_audit_task:
  description: >
    Compare the candidate’s GitHub profile with the job description ({job_posting_url}) 
    to identify whether the required skills are clearly represented.
    Use tools to detect matched or missing skills and suggest improvements.
  expected_output: >
    A report listing skills that match the job requirements, missing competencies, 
    and practical suggestions to improve the GitHub profile.
  agent: github_auditor

translation_task:
  description: >
    Review the resume and translate its content to British English, applying 
    a formal and professional tone suitable for job applications in the UK.
  expected_output: >
    A refined resume text in British English, ready for export to PDF.
  agent: translator

cover_letter_task:
  description: >
    Generate a personalised cover letter based on the candidate’s profile and 
    job description, but only if the job post requires one.
  expected_output: >
    A formal, compelling cover letter aligned with the job opportunity, or a message 
    stating that a cover letter was not required.
  agent: cover_letter_writer
